services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Django + Gunicorn + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: sahara-gold-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn sahara_gold.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120"
    healthCheckPath: /api/rates/latest/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTO_POPULATE_DATA
        value: "True"
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "True"
      - key: SSLCOMMERZ_IS_SANDBOX
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: sahara-gold-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React/Vite - 100% Free CDN & No Cold Starts)
  # ---------------------------------------------------------------------------
  - type: web
    name: sahara-gold-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ---------------------------------------------------------------------------
  # 3. PostgreSQL Database (Free Tier)
  # ---------------------------------------------------------------------------
  - name: sahara-gold-db
    plan: free
    databaseName: sahara_gold
    user: sahara_user
