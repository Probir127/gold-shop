services:
  # sahara-gold-cache already exists in this workspace and is referenced below.
  # Keep its approved plan, persistence and network settings managed in Render.
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Django + Gunicorn + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: sahara-gold-backend
    env: python
    plan: starter
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn sahara_gold.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120"
    healthCheckPath: /api/health/
    autoDeploy: true
    disk:
      name: sahara-gold-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MEDIA_ROOT
        value: /var/data
      - key: REDIS_URL
        fromService:
          name: sahara-gold-cache
          type: keyvalue
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTO_POPULATE_DATA
        value: "False"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "shara_gold"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "saharagold19@gmail.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Online checkout is disabled until configured in Admin → Settings.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "info@shaharagold.org"
      - key: DEFAULT_FROM_EMAIL
        value: "New Sahara Gold and Diamond <info@shaharagold.org>"
      - key: STORE_EMAIL
        value: "info@shaharagold.org"
      - key: ADMIN_NOTIFICATION_EMAIL
        value: "saharagold19@gmail.com"
      - key: USD_TO_BDT_RATE
        value: "122.5"
      - key: STORE_NAME
        value: "New Sahara Gold and Diamond"
      - key: STORE_PHONE
        value: "01799-281878"
      - key: STORE_WHATSAPP
        value: "8801799281878"
      - key: STORE_ADDRESS
        value: "Level-7, Block-A, Shop-19, Bashundhara City Shopping Mall, Dhaka"
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: APISED_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sahara-gold-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "https://www.shaharagold.org"
      - key: SITE_URL
        value: "https://www.shaharagold.org"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://www.shaharagold.org,https://shaharagold.org,https://sahara-gold-frontend.onrender.com"
      - key: ALLOWED_HOSTS
        value: "sahara-gold-backend.onrender.com,www.shaharagold.org,shaharagold.org"

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React/Vite CDN)
  # ---------------------------------------------------------------------------
  - type: web
    name: sahara-gold-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: sahara-gold-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_URL
        value: "https://sahara-gold-backend.onrender.com/api"
      - key: VITE_SITE_URL
        value: "https://www.shaharagold.org"

databases:
  # ---------------------------------------------------------------------------
  # 3. PostgreSQL Database (Starter)
  # ---------------------------------------------------------------------------
  - name: sahara-gold-db
    plan: starter
    databaseName: sahara_gold
    user: sahara_user
