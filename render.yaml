services:
  # ---------------------------------------------------------------------------
  # 1. Backend Web Service (Django + Gunicorn + PostgreSQL)
  # ---------------------------------------------------------------------------
  - type: web
    name: sahara-gold-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn sahara_gold.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120"
    healthCheckPath: /api/rates/latest/
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: AUTO_POPULATE_DATA
        value: "True"
      - key: DJANGO_SUPERUSER_USERNAME
        value: "shara_gold"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "saharagold19@gmail.com"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "sahara1122@@"
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "True"
      - key: SSLCOMMERZ_IS_SANDBOX
        value: "True"
      - key: SSLCOMMERZ_STORE_ID
        value: "testbox"
      - key: SSLCOMMERZ_STORE_PASS
        value: "qwerty"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_USE_SSL
        value: "True"
      - key: EMAIL_USE_TLS
        value: "False"
      - key: EMAIL_HOST_USER
        value: "saharagold19@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        value: "bbashnfejleenppq"
      - key: DEFAULT_FROM_EMAIL
        value: "Sahara Gold <saharagold19@gmail.com>"
      - key: STORE_EMAIL
        value: "saharagold19@gmail.com"
      - key: RESEND_API_KEY
        sync: false
      - key: USD_TO_BDT_RATE
        value: "122.5"
      - key: STORE_NAME
        value: "Sahara Gold & Diamond"
      - key: STORE_PHONE
        value: "01799-281878"
      - key: STORE_WHATSAPP
        value: "8801799281878"
      - key: STORE_ADDRESS
        value: "Level-7, Block-A, Shop-19, Bashundhara City Shopping Mall, Dhaka"
      - key: WEBHOOK_VERIFY_TOKEN
        value: "saharagold_verify_2026"
      - key: APISED_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: sahara-gold-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

  # ---------------------------------------------------------------------------
  # 2. Frontend Static Site (React/Vite - 100% Free CDN & No Cold Starts)
  # ---------------------------------------------------------------------------
  - type: web
    name: sahara-gold-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: sahara-gold-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_API_URL
        value: "https://sahara-gold-backend.onrender.com/api"
      - key: VITE_APISED_API_KEY
        value: "sk_4d2dB072e3BF68099002921813848002cce4e2Fa8e7bfe22"

databases:
  # ---------------------------------------------------------------------------
  # 3. PostgreSQL Database (Free Tier)
  # ---------------------------------------------------------------------------
  - name: sahara-gold-db
    plan: free
    databaseName: sahara_gold
    user: sahara_user
