<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Sahara Gold &amp; Diamond">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F7E7B4"/>
      <stop offset="30%"  stop-color="#E5C05B"/>
      <stop offset="60%"  stop-color="#C9941A"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F7E7B4"/>
      <stop offset="50%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F7E7B4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050505"  stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="36" fill="#0A0A0C"/>

  <!-- Soft radial glow behind gem -->
  <circle cx="128" cy="118" r="90" fill="url(#glowGrad)"/>

  <!-- Outer dashed circle ring -->
  <circle cx="128" cy="118" r="88" fill="none" stroke="#D4AF37" stroke-width="1"
          stroke-dasharray="5 6" stroke-opacity="0.35"/>

  <!-- ── Main Diamond Gem ── -->
  <!-- Top facet (bright) -->
  <polygon points="128,34  172,96  128,82  84,96" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Left upper facet -->
  <polygon points="84,96  128,82  128,162  60,130" fill="#C9941A"/>
  <!-- Right upper facet -->
  <polygon points="172,96  196,130  128,162  128,82" fill="#E5C05B"/>
  <!-- Left lower facet -->
  <polygon points="60,130  128,162  128,202" fill="#B8860B"/>
  <!-- Right lower facet -->
  <polygon points="196,130 128,202  128,162" fill="#D4AF37"/>
  <!-- Center reflection streak -->
  <polygon points="128,50  145,90  128,82  111,90" fill="#F7E7B4" fill-opacity="0.55"/>

  <!-- Outline strokes for sharp gem edges -->
  <g stroke="#F7E7B4" stroke-opacity="0.45" stroke-width="0.8" fill="none">
    <polygon points="128,34  172,96  128,82  84,96"/>
    <polygon points="84,96  128,82  128,162  60,130"/>
    <polygon points="172,96  196,130  128,162  128,82"/>
    <polygon points="60,130  128,162  128,202"/>
    <polygon points="196,130 128,202  128,162"/>
    <line x1="128" y1="34"  x2="128" y2="202"/>
    <line x1="84"  y1="96"  x2="196" y2="130"/>
    <line x1="60"  y1="130" x2="172" y2="96"/>
  </g>

  <!-- Brand text -->
  <text x="128" y="232"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="16" font-weight="700"
        letter-spacing="4"
        text-anchor="middle"
        fill="url(#goldGrad2)">SAHARA GOLD</text>
</svg>