name: Render Keep-Alive Heartbeat

on:
  schedule:
    - cron: "*/13 4-19 * * 1-5"
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Backend Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping /api/health/
        run: |
          BACKEND_URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL="https://sahara-gold-backend.onrender.com"
            echo "WARN: RENDER_BACKEND_URL secret not set, using default"
          fi
          HEALTH_URL="${BACKEND_URL}/api/health/"
          echo "Pinging: $HEALTH_URL"
          HTTP_STATUS=$(curl --silent --max-time 45 --output /dev/null --write-out "%{http_code}" "$HEALTH_URL")
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "OK - Backend is alive."
          else
            echo "WARN - Status $HTTP_STATUS (may be cold-starting). Not failing CI."
            exit 0
          fi